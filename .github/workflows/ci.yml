name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NVIM_VERSION: v0.12.5
  NVIM_SHA256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
  LAZY_SHA: 85c7ff3711b730b4030d03144f6db6375044ae82 # lazy.nvim v11.17.5

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Neovim (pinned, checksum verified)
        run: |
          curl -fsSL -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_SHA256}  nvim.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/nvim"
          tar -xzf nvim.tar.gz -C "$HOME/nvim" --strip-components=1
          echo "$HOME/nvim/bin" >> "$GITHUB_PATH"

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow unprivileged user namespaces (CI only)
        # Ubuntu 24.04 runners set kernel.apparmor_restrict_unprivileged_userns=1, which makes
        # bwrap fail for an unprivileged user; the specs need a working sandbox.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Diagnose parent-death behaviour of the runner (informational)
        continue-on-error: true
        run: |
          set +e
          echo "uname: $(uname -r)"
          try() { # name, flags...
            n=$1; shift
            sh -c "bwrap --die-with-parent $* --ro-bind / / --dev /dev --proc /proc sleep 3$RANDOM & wait" &
            P=$!; sleep 2; kill -9 $P; sleep 2
            left=$(ps -eo pid,ppid,stat,args | grep "bwrap --die-with-parent" | grep -v grep | grep -v "^ *$$ ")
            if [ -n "$left" ]; then echo "SURVIVED [$n]: $left" | cut -c1-200; pkill -KILL -f "bwrap --die-with-parent"; else echo "gone     [$n]"; fi
          }
          try plain --unshare-user
          try pid --unshare-user --unshare-pid
          try newsession --unshare-user --new-session
          try capdrop --unshare-user --cap-drop ALL
          try disable-userns --unshare-user --disable-userns
          try net --unshare-user --unshare-net
          try ipcutscgroup --unshare-user --unshare-ipc --unshare-uts --unshare-cgroup-try
          try all --new-session --unshare-user --disable-userns --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup-try --cap-drop ALL --unshare-net
          exit 0

      - name: Spec suite
        # Specs that need a working sandbox skip with a message on runners that
        # restrict user namespaces.
        run: nvim --version | head -1 && nvim -l tests/run.lua

      - name: Smoke test with lazy.nvim
        run: |
          git init -q "$RUNNER_TEMP/lazy.nvim"
          git -C "$RUNNER_TEMP/lazy.nvim" fetch -q --depth 1 https://github.com/folke/lazy.nvim.git "${LAZY_SHA}"
          git -C "$RUNNER_TEMP/lazy.nvim" checkout -q FETCH_HEAD
          LAZY_PATH="$RUNNER_TEMP/lazy.nvim" nvim --headless -u tests/e2e/smoke.lua
